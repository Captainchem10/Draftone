[theme]
base                = "dark"
primaryColor        = "#1e90ff"
backgroundColor     = "#0e1117"
secondaryBackgroundColor = "#162032"
textColor           = "#e8f4fd"
font                = "sans serif"

[server]
headless            = true
enableCORS          = false
enableXsrfProtection = false
port                = 8501
maxUploadSize       = 200

[browser]
gatherUsageStats    = false

[runner]
fastReruns          = true
